name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.NOBIFILE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NOBIFILE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOBIFILE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NOBIFILE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nobifile.p12"
            echo "NOBIFILE_KEYSTORE_FILE=$RUNNER_TEMP/nobifile.p12" >> "$GITHUB_ENV"
            echo "NOBIFILE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "NOBIFILE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "NOBIFILE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No fixed signing keystore secret set; falling back to default debug signing."
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Print APK signing cert
        run: |
          for apk in app/build/outputs/apk/debug/*.apk; do
            echo "== $apk"
            keytool -printcert -jarfile "$apk" | head -n 20
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NobiFile-debug-apk
          path: app/build/outputs/apk/debug/*.apk
